<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucifer Gift Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #121826;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #a855f7;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .search-box {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #9ca3af;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #374151;
            background: #1f293d;
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #a855f7;
        }
        .gift-section-title {
            text-align: left;
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .gift-item {
            background: #1f293d;
            padding: 15px 10px;
            border-radius: 14px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .gift-item:active {
            transform: scale(0.95);
        }
        .gift-item.active {
            border-color: #a855f7;
            background: #2d3748;
        }
        .gift-icon { font-size: 28px; }
        .gift-stars { color: #facc15; font-size: 14px; margin-top: 5px; font-weight: bold; }
        
        .send-btn {
            width: 100%;
            padding: 14px;
            background: #a855f7;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .send-btn:hover { background: #9333ea; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lucifer Gift Store</h1>
    
    <div class="search-box">
        <label for="usernameInput">Kimga yuboriladi?</label>
        <input type="text" id="usernameInput" placeholder="@username yoki ID raqami">
    </div>

    <div class="gift-section-title">Sovg'ani tanlang:</div>
    <div class="gift-grid">
        <div class="gift-item" onclick="selectGift(this, 15)">
            <div class="gift-icon">🎈</div>
            <div class="gift-stars">15 ⭐️</div>
        </div>
        <div class="gift-item" onclick="selectGift(this, 50)">
            <div class="gift-icon">🔥</div>
            <div class="gift-stars">50 ⭐️</div>
        </div>
        <div class="gift-item" onclick="selectGift(this, 100)">
            <div class="gift-icon">👑</div>
            <div class="gift-stars">100 ⭐️</div>
        </div>
    </div>

    <button class="send-btn" onclick="sendToBot()">Yuborish 🚀</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Oynani to'liq ochish

    let selectedStars = null;

    // Sovg'ani tanlash funksiyasi
    function selectGift(element, stars) {
        document.querySelectorAll('.gift-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        selectedStars = stars;
    }

    // Ma'lumotni to'g'ridan-to'g'ri botga yuborish
    function sendToBot() {
        const userInput = document.getElementById('usernameInput').value.trim();
        
        if (!userInput) {
            alert("Iltimos, kimga yuborishni kiriting (@username yoki ID)!");
            return;
        }
        if (!selectedStars) {
            alert("Iltimos, sovg'alardan birini tanlang!");
            return;
        }

        // Hech qanday server qidiruvlarisiz ma'lumotni botga qaytaramiz
        const resultData = {
            target: userInput,
            stars: selectedStars
        };

        tg.sendData(JSON.stringify(resultData));
    }
</script>

</body>
</html>
