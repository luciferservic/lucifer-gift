<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucifer Gift Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #121826;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #a855f7;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #1f293d;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #a855f7;
        }
        button {
            padding: 12px 18px;
            border: none;
            background: #a855f7;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #9333ea;
        }
        .user-card {
            background: #1f293d;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            text-align: left;
        }
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .gift-item {
            background: #1f293d;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .gift-item:hover, .gift-item.active {
            border-color: #a855f7;
            background: #2d3748;
        }
        .gift-icon { font-size: 24px; }
        .gift-stars { color: #facc15; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lucifer Gift Store</h1>
    
    <div class="search-box">
        <input type="text" id="usernameInput" placeholder="@username yoki ID yozing">
        <button onclick="searchUser()">🔍</button>
    </div>

    <div id="userCard" class="user-card">
        <p><strong>Foydalanuvchi:</strong> <span id="resName">...</span></p>
        <p><strong>ID:</strong> <span id="resId">...</span></p>
    </div>

    <div class="gift-grid">
        <div class="gift-item" onclick="selectGift(this, 15)">
            <div class="gift-icon">🎈</div>
            <div class="gift-stars">15 ⭐️</div>
        </div>
        <div class="gift-item" onclick="selectGift(this, 50)">
            <div class="gift-icon">🔥</div>
            <div class="gift-stars">50 ⭐️</div>
        </div>
        <div class="gift-item" onclick="selectGift(this, 100)">
            <div class="gift-icon">👑</div>
            <div class="gift-stars">100 ⭐️</div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // WebApp-ni to'liq ekranda ochish

    // Beeline'ning ikkala ehtimoliy IP manzillari ro'yxati
    const BACKEND_IPS = [
        "http://10.120.68.162:8000",
        "http://100.121.127.197:8000"
    ];

    let foundUser = null;
    let selectedStars = null;

    // Serverga so'rov yuborish funksiyasi (Ikkala IP-ni ham sinab ko'radi)
    async function sendRequest(endpoint, data) {
        for (let ip of BACKEND_IPS) {
            try {
                const response = await fetch(`${ip}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    timeout: 3000 // 3 soniya kutadi
                });
                if (response.ok) {
                    return await response.json();
                }
            } catch (err) {
                console.log(`${ip} ulanib bo'lmadi, keyingisi sinab ko'rilmoqda...`);
            }
        }
        throw new Error("Backend serverga ulanishning iloji bo'lmadi.");
    }

    // Foydalanuvchini qidirish
    async function searchUser() {
        const query = document.getElementById('usernameInput').value.trim();
        if (!query) {
            alert("Iltimos, username yoki ID kiriting!");
            return;
        }

        try {
            const data = await sendRequest('/search', { query: query });
            if (data && data.status === 'success') {
                foundUser = data.user;
                document.getElementById('resName').innerText = foundUser.first_name || "Noma'lum";
                document.getElementById('resId').innerText = foundUser.id;
                document.getElementById('userCard').style.display = 'block';
            } else {
                alert("Foydalanuvchi topilmadi!");
            }
        } catch (error) {
            alert("Xatolik: Server javob bermadi. Termux yoqiqligini tekshiring!");
        }
    }

    // Sovg'ani tanlash
    function selectGift(element, stars) {
        if (!foundUser) {
            alert("Iltimos, avval foydalanuvchini qidirib toping!");
            return;
        }
        
        // Aktiv klassni boshqarish
        document.querySelectorAll('.gift-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        
        selectedStars = stars;
        
        // Telegram botga ma'lumotni qaytarish (In-app to'lov oynasini ochish uchun)
        const resultData = {
            user_id: foundUser.id,
            stars: selectedStars
        };
        
        // Ma'lumotni botga jo'natib, WebApp-ni yopish
        tg.sendData(JSON.stringify(resultData));
    }
</script>

</body>
</html>
